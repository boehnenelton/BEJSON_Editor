<!--
  Component: Header
  Description: Simple purpose-driven header conforming strictly to §3 Header Design Law:
               [Hamburger Button] [App Title] [Settings/Theme Toggle]
-->
<header class="header">
  <button class="btn btn-icon" id="btnHamburger" title="Navigation Menu" aria-label="Navigation Menu" style="font-size: 16px; padding: 4px 10px; margin-right: 12px; line-height: 1;">☰</button>
  <div style="font-weight: 900; font-size: 14px; flex-shrink: 0; letter-spacing: -0.3px;">BEJSON Editor</div>
  <button class="btn" id="btnToggleTheme" style="margin-left: auto; flex-shrink: 0;" title="Toggle Theme">
    <span id="themeIcon">☀️</span> <span id="themeLabel">Light</span>
  </button>
</header>
